assessment_objectives:
- code: A
  name: Knowledge with understanding
  description: A1 scientific phenomena, facts, laws, definitions, concepts and theories; A2 scientific vocabulary, terminology and conventions, (including symbols, quantities, units); A3 scientific instruments and apparatus, including techniques of operation and aspects of safety; A4 scientific quantities and their determination; A5 scientific and technological applications with their social, economic and environmental implications.
  qualification_weight_percent: 40
- code: B
  name: Handling information and solving problems
  description: B1 locate, select, organise and present information from a variety of sources; B2 translate information from one form to another; B3 manipulate numerical and other data; B4 use information to identify patterns, report trends and draw inferences; B5 present reasoned explanations for phenomena, patterns and relationships; B6 make predictions and hypotheses and solve problems; B7 apply knowledge, including principles, to new situations; B8 demonstrate an awareness of the limitations of biological theories and models.
  qualification_weight_percent: 40
- code: C
  name: Practical (experimental and investigative) skills and abilities
  description: C1 Follow a sequence of instructions,using appropriate techniques, handling apparatus and materials competently and having due regard for safety; C2 make and record estimates, observations and measurements accurately; C3 handle and process experimental observations and data, including dealing with anomalous or inconsistent results; C4 apply scientific knowledge and understanding to make interpretations and to draw appropriate conclusions from practical observations and data; C5 plan, design and carry out investigations (based on concepts familiar to learners) and suggest modifications in the light of experience.
  qualification_weight_percent: 20
command_words:
- word: Define (the term(s)...).
  meaning: is intended literally. Only a formal statement or equivalent paraphrase is required
- word: What do you understand by/What is meant by (the term(s)...)
  meaning: normally implies that a definition should be given, together with some relevant comment on the significance or context of the term(s) concerned, especially where two or more terms are included in the question. The amount of supplementary comment intended should be interpreted in the light of the indicated mark value.
- word: State
  meaning: implies a concise answer with little or no supporting argument, e.g. a numerical answer that can be obtained 'by inspection'.
- word: List
  meaning: requires a number of points with no elaboration. If a specific number of points is requested, this number should not be exceeded.
- word: Explain
  meaning: may imply reasoning or some reference to theory, depending on the context.It is another way of asking candidates to give reasons for. The candidate needs to make sure that the examiner is told why something happens.
- word: Give a reason/ give reasons
  meaning: this is another way of asking candidates to explain why something happens.
- word: Describe
  meaning: requires candidates to state in words (using diagrams where appropriate) the main points of the topic. It is often used with reference either to particular phenomena or to particular experiments. For particular phenomena, the term usually implies that the answer should include reference to (visual) observations associated with the phenomena. In other contexts, describe and give an account ofshould be interpreted more generally, i.e. the candidate has greater discretion about the nature and the organisation of the material to be included in the answer. Describe and explainmay be coupled in a similar way to state and explain.Describe a processmeansgive a step-by-step description of what happens during the process.
- word: Discuss
  meaning: requires candidates to give a critical account of the points involved in the topic.
- word: Outline
  meaning: implies brevity, i.e. restricting the answer to giving essentials.
- word: Deduce
  meaning: follow the guidance for predict, but a supporting statement is also required. For example, reference to a law, a principle or the necessary reasoning should be included in the answer.
- word: predict
  meaning: implies that the candidate is not expected to produce the required answer by recall but by making a logical connection between other pieces of information. Such information may be wholly given in the question or may depend on answers extracted in an earlier part of the question.
- word: Comment
  meaning: is intended as an open-ended instruction, inviting candidates to recall or infer points ofinterest relevant to the context of the question, taking account of the number of marks available.
- word: Suggest
  meaning: 'Suggest: may imply that there is no single correct answer (for example, in biology, there are a number of factors that might limit the rate of photosynthesis in a plant in a glasshouse). Suggest: may also imply that the candidate must apply their general knowledge and understanding of biology to a ''novel'' situation, one that may not formally be ''in the syllabus''. Many data-response and problem-solving questions are of this type.'
- word: Find
  meaning: is a general term that may variously be interpreted as calculate, measure, determine, etc.
- word: Calculate
  meaning: is used when a numerical answer is required. In general, working should be shown, especially where two or more steps are involved.The candidate should give suitable units where possible.
- word: Measure
  meaning: implies that the quantity concerned can be directly obtained from a suitable measuringinstrument, e.g. length, using a rule, or angle, using a protractor.The candidate should give suitable units where possible.
- word: Determine
  meaning: often implies that the quantity concerned cannot be measured directly but is obtained by calculation, substituting measured or known values of other quantities into a standard formula. It may also be used when the candidate must carry out a procedure to find a numerical answer.
- word: Estimate
  meaning: implies a reasoned order of magnitude statement or calculation of the quantity concerned. Candidates should make any necessary simplifying assumptions about points of principle and about the values of quantities not otherwise included in the question.
- word: Show
  meaning: make an algebraic deduction to prove a given equation. The candidate must state clearly the terms being used.
- word: Sketch
  meaning: when applied to graph work, implies that the shape and/or position of the curve need only be qualitatively correct, but candidates should be aware that, depending on the context, some quantitative aspects may be looked for, e.g. passing through the origin, having an intercept, asymptote or discontinuity at a particular value. In diagrams, sketch implies that a simple, freehand drawing is acceptable though care should be taken over proportions and the clear exposition of important details.
- word: Construct
  meaning: is often used in relation to chemical equations where a candidate is expected to write a balanced equation, not by factual recall but by analogy or by using information in the question.
- word: Compare
  meaning: requires candidates to provide both the similarities and differences between things orconcepts.
- word: Recognise
  meaning: identify facts, characteristics or concepts that are relevant and/or appropriate to understanding a situation, event, process or phenomenon.
- word: Classify
  meaning: requires candidates to group things based on common characteristics.
